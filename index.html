<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>엑셀 단축키</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 기본 초기화 */
html { color-scheme: light; -webkit-text-size-adjust: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }

/* 레이아웃: 엑셀 시트처럼 격자 무늬 머리말 + 고정 검색줄 + 분류별 행 목록 (휴대폰 한 칸 폭 기준) */
:root {
  --bg: #F2F5F1;
  --surface: #FFFFFF;
  --ink: #13241A;
  --muted: #5B6D61;
  --line: #DDE5DE;
  --accent: #1B6B43;
  --accent-ink: #FFFFFF;
  --cap: #EEF2EE;
  --cap-edge: #C3D0C6;
  --star: #B7790B;
  --hero: #14452E;
  --hero-ink: #EAF4ED;
  --hero-grid: rgba(234, 244, 237, 0.10);
  --hero-chip: rgba(234, 244, 237, 0.16);
  --font-body: 'IBM Plex Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1611;
    --surface: #15221A;
    --ink: #E5EEE7;
    --muted: #96AA9D;
    --line: #26382C;
    --accent: #5CC892;
    --accent-ink: #0A1A11;
    --cap: #1D2E23;
    --cap-edge: #3A5042;
    --star: #E2A93B;
    --hero: #123223;
    --hero-ink: #E5EEE7;
    --hero-grid: rgba(229, 238, 231, 0.07);
    --hero-chip: rgba(229, 238, 231, 0.12);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1611;
  --surface: #15221A;
  --ink: #E5EEE7;
  --muted: #96AA9D;
  --line: #26382C;
  --accent: #5CC892;
  --accent-ink: #0A1A11;
  --cap: #1D2E23;
  --cap-edge: #3A5042;
  --star: #E2A93B;
  --hero: #123223;
  --hero-ink: #E5EEE7;
  --hero-grid: rgba(229, 238, 231, 0.07);
  --hero-chip: rgba(229, 238, 231, 0.12);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-block: 12px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bg);
}
.wrap { max-width: 760px; margin: 0 auto; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 머리말 */
.hero {
  background-color: var(--hero);
  background-image:
    linear-gradient(var(--hero-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--hero-grid) 1px, transparent 1px);
  background-size: 100% 28px, 56px 100%;
  color: var(--hero-ink);
  border-radius: 12px;
  padding: 18px 18px 16px;
}
.hero h1 {
  margin: 0;
  font-size: 26px;
  line-height: 1.2;
  font-weight: 700;
  letter-spacing: -0.02em;
  text-wrap: balance;
}
.hero p { margin: 6px 0 0; font-size: 13.5px; opacity: 0.85; }
.cells {
  display: flex; gap: 6px; margin-top: 14px; font-family: var(--font-mono);
  font-size: 12px; font-weight: 500;
}
.cells span { background: var(--hero-chip); padding: 3px 9px; border-radius: 4px; }

/* 고정 검색줄 */
.bar { padding-block: 14px 4px; }
.chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.chip {
  height: 46px; padding: 0 14px;
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); font-size: 15px; font-weight: 500;
}
.chip b { font-family: var(--font-mono); font-size: 12px; font-weight: 500; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip[aria-pressed="true"] b { color: inherit; opacity: 0.8; }

.meta {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  margin-top: 8px; font-size: 13px; color: var(--muted);
}
.meta .range { font-family: var(--font-mono); font-size: 12.5px; }

/* 목록 */
.grp { margin-top: 14px; }
.grp h2 {
  margin: 0 0 8px; padding-inline: 2px; display: flex; align-items: baseline; gap: 8px;
  font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
}
.grp h2 span { font-family: var(--font-mono); font-weight: 500; letter-spacing: 0; }
.rows { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.row { display: flex; align-items: center; gap: 10px; padding: 8px 4px 8px 12px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.keys { flex: 0 1 46%; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.cap {
  display: inline-grid; place-items: center; min-width: 28px; height: 28px; padding: 0 7px;
  font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; line-height: 1;
  color: var(--ink); background: var(--cap);
  border: 1px solid var(--cap-edge); border-bottom-width: 3px; border-radius: 6px;
}
.plus { font-size: 11px; color: var(--muted); }
.txt { flex: 1 1 0; min-width: 0; }
.d { font-weight: 500; text-wrap: pretty; }
.h { margin-top: 1px; font-size: 12.5px; line-height: 1.4; color: var(--muted); }

.star { flex: 0 0 auto; width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: transparent; color: var(--muted); }
.star svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
.star[aria-pressed="true"] { color: var(--star); }
.star[aria-pressed="true"] svg { fill: currentColor; }

.empty { margin-top: 28px; padding: 28px 16px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--cap-edge); border-radius: 10px; }
.empty strong { display: block; color: var(--ink); margin-bottom: 4px; font-weight: 600; }
.foot { margin-top: 22px; font-size: 12.5px; color: var(--muted); text-align: center; }

</style>
</head>
<body>

<div class="wrap">
  <header class="hero">
    <h1>엑셀 단축키</h1>
    <p>단축키표 사진을 폰에서 바로 찾아보는 사전.</p>
    <div class="cells" aria-hidden="true"><span>A1</span><span>Ctrl</span><span>Shift</span><span>F1~F12</span></div>
  </header>

  <div class="bar">
    <div class="chips" id="chips" role="group" aria-label="분류"></div>
    <div class="meta">
      <span class="range" id="count"></span>
    </div>
  </div>

  <main id="list"></main>
  <p class="foot">별을 누르면 즐겨찾기에 담깁니다.</p>
</div>

<script>
(function () {
  var NOTE_PG = '스티커에는 위·아래가 반대로 적혀 있어, 실제 동작 기준으로 바로잡았습니다.';
  var GROUPS = [
    { id: 'ctrl', label: 'Ctrl', pre: ['Ctrl'], items: [
      ['A', '모두 선택'], ['C', '복사'],
      ['D', '윗셀 복사 붙여넣기', '바로 위 셀의 내용을 아래 셀로 채웁니다'],
      ['F', '찾기'], ['I', '글자 기울이기'],
      ['N', '새 통합문서', '통합문서 = 엑셀 파일 하나'],
      ['O', '통합문서 열기'], ['P', '인쇄'],
      ['R', '왼쪽셀 복사 붙여넣기', '바로 왼쪽 셀의 내용을 오른쪽 셀로 채웁니다'],
      ['S', '저장'], ['V', '붙여넣기'], ['X', '잘라내기'],
      ['Y', '재실행', '취소한 작업을 다시 실행'],
      ['Z', '실행취소'],
      ['1', '셀 서식창 표시', '글꼴·표시 형식·테두리를 한 번에 설정하는 창'],
      ['2', '글씨 굵게'], ['4', '글씨 밑줄'], ['5', '삭제선'], ['9', '행 숨기기'],
      ['F2', '인쇄 미리보기'], ['F4', '창닫기'],
      ['F11', '새 매크로 시트', '매크로 = 반복 작업을 자동으로 실행하는 기능'],
      ['F12', '열기'],
      ['Home', '워크시트 처음으로', '워크시트 = 엑셀 안의 시트 한 장 (A1 셀로 이동)'],
      ['End', '워크시트 끝으로', '데이터가 있는 마지막 셀로 이동'],
      ['Tab', '다음 창으로'], ['Space', '열 전체 선택'],
      ['+', '셀/행/열 삽입'], ['-', '셀/행/열 삭제']
    ]},
    { id: 'shift', label: 'Shift', pre: ['Shift'], items: [
      ['F2', '메모 삽입'],
      ['F3', '함수마법사', '함수를 골라 입력하도록 도와주는 창'],
      ['F5', '찾기'],
      ['F9', '현재시트 재계산', '현재 시트의 수식 결과를 다시 계산'],
      ['F10', '팝업 메뉴', '마우스 오른쪽 클릭 메뉴'],
      ['F11', '새시트 삽입'],
      ['↑↓←→', '선택한 셀과 그 방향의 셀 선택', '방향키로 선택 범위를 한 칸씩 넓힙니다'],
      ['Enter', '윗 행으로 이동'], ['Space', '행 전체 선택'], ['Tab', '왼쪽 열로 이동'],
      ['PgUp', '선택한 셀과 1페이지 위의 셀까지 모두 선택', NOTE_PG],
      ['PgDn', '선택한 셀과 1페이지 아래의 셀까지 모두 선택', NOTE_PG]
    ]},
    { id: 'ctrlshift', label: 'Ctrl + Shift', pre: ['Ctrl', 'Shift'], items: [
      ['#', '년,월,일로 날짜 서식 적용', '서식 = 숫자·글자가 보이는 모양'],
      ['%', '소수 자릿수 없이 백분율 서식 적용'],
      ['&', '선택한 셀에 윤곽선 테두리 적용', '윤곽선 = 선택 범위의 바깥쪽 테두리'],
      [':', '현재 시간 입력'],
      ['@', '시간,분,AM/PM 시간 서식 적용'],
      ['^', '소수 두자리 지수 숫자 서식 적용', '지수 표기 예: 1.23E+04'],
      ['P', '글꼴 크기 변경'],
      ['F6', '이전 통합문서로'],
      ['_', '선택한 셀 윤곽선 테두리를 제거'],
      ['~', '일반 숫자 서식 적용', '서식이 없는 기본 숫자 모양'],
      ['F', '글꼴 변경'],
      ['↑', '선택한 셀과 위쪽 데이터 셀 모두 선택', '데이터가 이어지는 끝 셀까지 한 번에 선택'],
      ['↓', '선택한 셀과 아래쪽 데이터 셀 모두 선택', '데이터가 이어지는 끝 셀까지 한 번에 선택'],
      ['←', '선택한 셀과 좌측 데이터 셀 모두 선택', '데이터가 이어지는 끝 셀까지 한 번에 선택'],
      ['→', '선택한 셀과 우측 데이터 셀 모두 선택', '데이터가 이어지는 끝 셀까지 한 번에 선택']
    ]},
    { id: 'f', label: 'F1~F12', pre: [], items: [
      ['F1', '도움말'], ['F2', '현재 셀 편집'],
      ['F3', '셀 이름 넣기', '이름을 붙여 둔 셀·범위를 수식에 넣습니다'],
      ['F4', '마지막 작업 반복', '수식 입력 중에는 절대참조($) 전환'],
      ['F5', '이동', '원하는 셀 주소로 바로 이동'],
      ['F6', '다음 틀로 이동', '나뉘거나 고정된 창 사이를 이동'],
      ['F7', '맞춤법 검사'],
      ['F8', '영역 선택', '방향키로 범위를 넓히는 선택 모드 켜기'],
      ['F9', '모두 다시 계산', '열린 모든 파일의 수식을 다시 계산'],
      ['F10', '메뉴 활성', '리본 메뉴(상단 메뉴줄)에 단축 글자 표시'],
      ['F11', '현재범위 차트 만들기', '새 차트 시트에 만듭니다'],
      ['F12', '다른 이름으로 저장']
    ]},
    { id: 'etc', label: '기타', pre: [], items: [
      ['Home', '첫행으로 이동', '현재 행의 맨 왼쪽(A열)으로 이동'],
      ['End', '모드 끔/켬', 'End 누른 뒤 방향키를 누르면 데이터 끝으로 이동'],
      ['Tab', '다음 셀로 이동'],
      ['Enter', '입력, 링크 실행'],
      ['Delete', '삭제'],
      ['Alt', '단축키 확인', '리본 메뉴에 단축 글자가 표시됩니다'],
      ['Alt|F1', '차트 삽입'],
      ['Alt|F2', '다른 이름으로 저장'],
      ['Alt|F4', '종료'],
      ['Alt|F8', '매크로 대화상자', '매크로 목록을 보고 실행하는 창'],
      ['Alt|F', '파일 메뉴'],
      ['Alt|↓', '선택한 드롭다운 목록 열기', '드롭다운 = 아래로 펼쳐지는 선택 목록'],
      ['Ctrl|;', '현재 날짜 입력'],
      ['Ctrl|PgUp', '이전 워크시트로'],
      ['Ctrl|PgDn', '다음 워크시트로']
    ]}
  ];

  var ALIAS = {
    '+': '플러스 더하기 plus', '-': '마이너스 빼기 minus', ';': '세미콜론',
    '#': '샵 해시', '%': '퍼센트', '&': '앰퍼샌드', ':': '콜론', '@': '골뱅이',
    '^': '캐럿 지수', '_': '언더바 밑줄', '~': '물결 틸드',
    'PgUp': 'pageup page up 페이지업', 'PgDn': 'pagedown page down 페이지다운',
    'Space': 'spacebar space bar 스페이스', '↑': '위 방향키 up', '↓': '아래 방향키 down',
    '←': '왼쪽 방향키 left', '→': '오른쪽 방향키 right', '↑↓←→': '방향키 화살표',
    'Ctrl': '컨트롤', 'Shift': '시프트', 'Alt': '알트', 'Tab': '탭', 'Enter': '엔터',
    'Delete': '딜리트 del', 'Home': '홈', 'End': '엔드'
  };

  function norm(s) { return String(s).toLowerCase().replace(/[\s+]/g, ''); }

  var ALL = [];
  GROUPS.forEach(function (g) {
    g.items.forEach(function (it, i) {
      var keys = g.pre.concat(it[0].split('|'));
      var alias = keys.map(function (k) { return ALIAS[k] || ''; }).join(' ');
      ALL.push({
        id: g.id + '-' + i, gid: g.id, keys: keys, desc: it[1], hint: it[2] || '',
        hay: norm(keys.join('')) + '§' + norm(alias) + '§' + norm(it[1]) + '§' + norm(it[2] || '')
      });
    });
  });

  var state = { cat: 'ctrl', favs: {} };
  try { state.favs = JSON.parse(localStorage.getItem('xl-favs') || '{}') || {}; } catch (e) {}

  var $list = document.getElementById('list');
  var $chips = document.getElementById('chips');
  var $count = document.getElementById('count');

  function favCount() { return ALL.filter(function (x) { return state.favs[x.id]; }).length; }

  function renderChips() {
    var defs = [];
    GROUPS.forEach(function (g) { defs.push({ id: g.id, label: g.label, n: g.items.length }); });
    defs.push({ id: 'fav', label: '★ 즐겨찾기', n: favCount() });
    $chips.textContent = '';
    defs.forEach(function (d) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'chip';
      b.setAttribute('aria-pressed', state.cat === d.id ? 'true' : 'false');
      b.appendChild(document.createTextNode(d.label + ' '));
      var n = document.createElement('b'); n.textContent = d.n; b.appendChild(n);
      b.addEventListener('click', function () { state.cat = d.id; render(); });
      $chips.appendChild(b);
    });
  }

  function starSvg() {
    return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1.1 5.9L12 16.9 6.7 19.7l1.1-5.9L3.5 9.7l5.9-.8z"/></svg>';
  }

  function rowEl(x) {
    var li = document.createElement('li'); li.className = 'row';
    var keys = document.createElement('div'); keys.className = 'keys';
    x.keys.forEach(function (k, i) {
      if (i) { var p = document.createElement('span'); p.className = 'plus'; p.textContent = '+'; keys.appendChild(p); }
      var c = document.createElement('kbd'); c.className = 'cap'; c.textContent = k; keys.appendChild(c);
    });
    var t = document.createElement('div'); t.className = 'txt';
    var d = document.createElement('div'); d.className = 'd'; d.textContent = x.desc; t.appendChild(d);
    if (x.hint) { var h = document.createElement('div'); h.className = 'h'; h.textContent = x.hint; t.appendChild(h); }
    var s = document.createElement('button'); s.type = 'button'; s.className = 'star';
    var on = !!state.favs[x.id];
    s.setAttribute('aria-pressed', on ? 'true' : 'false');
    s.setAttribute('aria-label', x.keys.join('+') + ' 즐겨찾기');
    s.innerHTML = starSvg();
    s.addEventListener('click', function (e) {
      e.stopPropagation();
      if (state.favs[x.id]) delete state.favs[x.id]; else state.favs[x.id] = 1;
      try { localStorage.setItem('xl-favs', JSON.stringify(state.favs)); } catch (er) {}
      render();
    });
    li.appendChild(keys); li.appendChild(t); li.appendChild(s);
    return li;
  }

  function render() {
    var shown = ALL.filter(function (x) {
      if (state.cat === 'fav') return !!state.favs[x.id];
      return state.cat === 'all' || x.gid === state.cat;
    });

    renderChips();
    $count.textContent = 'A1:A' + Math.max(shown.length, 1) + ' · ' + shown.length + '개';

    $list.textContent = '';
    if (!shown.length) {
      var e = document.createElement('div'); e.className = 'empty';
      var msg = ['즐겨찾기가 비어 있습니다', '목록에서 별을 눌러 자주 쓰는 단축키를 담아 보세요.'];
      e.innerHTML = '<strong></strong><span></span>';
      e.firstChild.textContent = msg[0]; e.lastChild.textContent = msg[1];
      $list.appendChild(e);
      return;
    }
    GROUPS.forEach(function (g) {
      var items = shown.filter(function (x) { return x.gid === g.id; });
      if (!items.length) return;
      var sec = document.createElement('section'); sec.className = 'grp';
      var h = document.createElement('h2'); h.textContent = g.label + ' ';
      var n = document.createElement('span'); n.textContent = items.length; h.appendChild(n);
      var ul = document.createElement('ul'); ul.className = 'rows';
      items.forEach(function (x) { ul.appendChild(rowEl(x)); });
      sec.appendChild(h); sec.appendChild(ul); $list.appendChild(sec);
    });
  }

  render();
})();
</script>
</body>
</html>
